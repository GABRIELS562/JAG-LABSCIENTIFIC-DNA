apiVersion: apps/v1
kind: Deployment
metadata:
  name: lims-complete
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lims-complete
  template:
    metadata:
      labels:
        app: lims-complete
    spec:
      containers:
      - name: lims-complete
        image: localhost:5000/lims-complete:final-live
        ports:
        - containerPort: 5173
        - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: lims-service
  namespace: production
spec:
  type: NodePort
  selector:
    app: lims-complete
  ports:
  - name: frontend
    port: 5173
    nodePort: 30007
  - name: backend
    port: 3001
    nodePort: 30008
