apiVersion: apps/v1
kind: Deployment
metadata:
  name: lims-complete
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lims-complete
  template:
    metadata:
      labels:
        app: lims-complete
    spec:
      containers:
      - name: lims-complete
        image: localhost:5000/lims-complete:showcase-ready
        ports:
        - containerPort: 5173
        - containerPort: 3001
        envFrom:
        - configMapRef:
            name: lims-config
        env:
        - name: DATABASE_PASSWORD
          value: "lims_password"  # In production, use a Secret instead
        - name: DATABASE_URL
          value: "postgresql://lims_user:lims_password@postgresql.production.svc.cluster.local:5432/lims_db"
        livenessProbe:
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 10
          periodSeconds: 5
