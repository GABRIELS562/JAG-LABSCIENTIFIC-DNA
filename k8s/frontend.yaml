apiVersion: apps/v1
kind: Deployment
metadata:
  name: lims-frontend
  namespace: lims
  labels:
    app: lims-frontend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lims-frontend
  template:
    metadata:
      labels:
        app: lims-frontend
        version: v1
    spec:
      containers:
      - name: frontend
        image: localhost:5000/lims-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: lims-frontend
  namespace: lims
spec:
  selector:
    app: lims-frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: ClusterIP