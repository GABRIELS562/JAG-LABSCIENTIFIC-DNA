apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lims-ingress
  namespace: lims
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
  - host: lims.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: lims-backend
            port:
              number: 3001
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lims-frontend
            port:
              number: 80
  # For production with SSL
  # tls:
  # - hosts:
  #   - your-domain.com
  #   secretName: lims-tls