# Kind cluster configuration for LIMS deployment
# This creates a production-like environment on your local machine
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lims-cluster

# Cluster configuration
nodes:
  # Control plane node (manages the cluster)
  - role: control-plane
    # Port mappings for accessing services from your host
    extraPortMappings:
      # HTTP traffic
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS traffic  
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      # NodePort range for services (backend, frontend)
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
      - containerPort: 30002
        hostPort: 30002
        protocol: TCP
    # Extra mounts for persistent storage
    extraMounts:
      - hostPath: /tmp/lims-data
        containerPath: /data
        
  # Worker node 1 (runs your applications)
  - role: worker
    extraMounts:
      - hostPath: /tmp/lims-data
        containerPath: /data
        
  # Worker node 2 (for high availability)
  - role: worker
    extraMounts:
      - hostPath: /tmp/lims-data
        containerPath: /data

# Networking configuration
networking:
  # Use default CNI (Container Network Interface)
  disableDefaultCNI: false
  # Pod subnet (internal pod communication)
  podSubnet: "10.244.0.0/16"
  # Service subnet (service discovery)
  serviceSubnet: "10.96.0.0/12"