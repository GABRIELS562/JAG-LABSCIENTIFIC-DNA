apiVersion: apps/v1
kind: Deployment
metadata:
  name: lims-backend
  namespace: lims
  labels:
    app: lims-backend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lims-backend
  template:
    metadata:
      labels:
        app: lims-backend
        version: v1
    spec:
      containers:
      - name: backend
        image: localhost:5000/lims-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          value: "postgresql://lims_user:lims_password@postgres:5432/lims_db"
        - name: DATABASE_HOST
          value: "postgres"
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_NAME
          value: "lims_db"
        - name: DATABASE_USER
          value: "lims_user"
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: ENABLE_MOCK_SAMPLES
          value: "true"
        - name: SAMPLE_CYCLE_INTERVAL
          value: "30000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: lims-backend
  namespace: lims
spec:
  selector:
    app: lims-backend
  ports:
  - name: http
    port: 3001
    targetPort: 3001
  type: ClusterIP