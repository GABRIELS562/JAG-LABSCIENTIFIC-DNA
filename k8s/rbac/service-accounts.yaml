# Service Accounts for automation and applications
---
# CI/CD Service Account for GitHub Actions
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: production
  labels:
    app.kubernetes.io/name: ci-deployer
    app.kubernetes.io/part-of: lims-rbac
automountServiceAccountToken: true

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: develop
  labels:
    app.kubernetes.io/name: ci-deployer
    app.kubernetes.io/part-of: lims-rbac
automountServiceAccountToken: true

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: test
  labels:
    app.kubernetes.io/name: ci-deployer
    app.kubernetes.io/part-of: lims-rbac
automountServiceAccountToken: true

---
# Monitoring Service Account for Prometheus
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: lims-monitoring
automountServiceAccountToken: true

---
# Backup Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-operator
  namespace: production
  labels:
    app.kubernetes.io/name: backup-operator
    app.kubernetes.io/part-of: lims-rbac
automountServiceAccountToken: true

---
# ArgoCD Service Account for managing applications
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-manager
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-manager
    app.kubernetes.io/part-of: lims-rbac
automountServiceAccountToken: true
