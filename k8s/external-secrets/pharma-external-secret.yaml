# ExternalSecret for Pharma application
# Syncs secrets from Vault path secret/pharma to Kubernetes secret pharma-secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pharma-secrets
  namespace: production
  labels:
    app: pharma
    team: devops
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: pharma-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app: pharma
          managed-by: external-secrets
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: pharma
        property: db_host
    - secretKey: DB_PORT
      remoteRef:
        key: pharma
        property: db_port
    - secretKey: DB_NAME
      remoteRef:
        key: pharma
        property: db_name
    - secretKey: DB_USER
      remoteRef:
        key: pharma
        property: db_user
    - secretKey: DB_PASSWORD
      remoteRef:
        key: pharma
        property: db_password
    - secretKey: API_KEY
      remoteRef:
        key: pharma
        property: api_key
