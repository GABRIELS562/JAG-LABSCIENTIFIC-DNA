# ClusterSecretStore for Vault on Server2
# This allows all namespaces to fetch secrets from Vault
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  labels:
    app.kubernetes.io/name: vault-backend
    app.kubernetes.io/part-of: external-secrets
spec:
  provider:
    vault:
      # Vault server address (Server2 Tailscale IP)
      server: "http://100.103.13.92:8200"
      # KV v2 secrets engine path
      path: "secret"
      version: "v2"
      # Token authentication
      auth:
        tokenSecretRef:
          name: "vault-token"
          namespace: "external-secrets"
          key: "token"
