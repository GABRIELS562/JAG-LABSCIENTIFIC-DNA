# Kubernetes Secret containing Vault token for External Secrets Operator
#
# IMPORTANT: Do NOT commit actual tokens to git!
# Create this secret manually on the cluster:
#
#   kubectl create secret generic vault-token \
#     --from-literal=token=<YOUR_VAULT_TOKEN> \
#     -n external-secrets
#
# To generate a token with the external-secrets policy in Vault:
#   vault token create -policy=external-secrets -period=768h
#
apiVersion: v1
kind: Secret
metadata:
  name: vault-token
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: vault-token
    app.kubernetes.io/part-of: external-secrets
type: Opaque
stringData:
  # Replace with actual Vault token - DO NOT COMMIT REAL TOKENS
  token: "REPLACE_WITH_VAULT_TOKEN"
