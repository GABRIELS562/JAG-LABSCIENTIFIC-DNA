# ExternalSecret for Finance application
# Syncs secrets from Vault path secret/finance to Kubernetes secret finance-secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: finance-secrets
  namespace: production
  labels:
    app: finance
    team: devops
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: finance-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app: finance
          managed-by: external-secrets
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: finance
        property: db_host
    - secretKey: DB_PORT
      remoteRef:
        key: finance
        property: db_port
    - secretKey: DB_NAME
      remoteRef:
        key: finance
        property: db_name
    - secretKey: DB_USER
      remoteRef:
        key: finance
        property: db_user
    - secretKey: DB_PASSWORD
      remoteRef:
        key: finance
        property: db_password
    - secretKey: API_KEY
      remoteRef:
        key: finance
        property: api_key
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: finance
        property: encryption_key
