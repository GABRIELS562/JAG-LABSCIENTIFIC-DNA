# ExternalSecret for LIMS application
# Syncs secrets from Vault path secret/lims to Kubernetes secret lims-secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lims-secrets
  namespace: production
  labels:
    app: lims
    team: devops
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: lims-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app: lims
          managed-by: external-secrets
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: lims
        property: db_host
    - secretKey: DB_PORT
      remoteRef:
        key: lims
        property: db_port
    - secretKey: DB_NAME
      remoteRef:
        key: lims
        property: db_name
    - secretKey: DB_USER
      remoteRef:
        key: lims
        property: db_user
    - secretKey: DB_PASSWORD
      remoteRef:
        key: lims
        property: db_password
    - secretKey: JWT_SECRET
      remoteRef:
        key: lims
        property: jwt_secret
    - secretKey: API_KEY
      remoteRef:
        key: lims
        property: api_key
