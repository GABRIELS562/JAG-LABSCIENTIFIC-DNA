name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  NAMESPACE: production

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install and build frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "1.0.0")
          TAG="v${VERSION}-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Image tag: $TAG"

      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure Docker for insecure registry
        run: |
          echo '{"insecure-registries": ["${{ env.REGISTRY }}"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sleep 5

      - name: Build and push backend
        run: |
          docker build -t ${{ env.REGISTRY }}/lims-backend:${{ steps.meta.outputs.tag }} ./backend
          docker push ${{ env.REGISTRY }}/lims-backend:${{ steps.meta.outputs.tag }}
          docker tag ${{ env.REGISTRY }}/lims-backend:${{ steps.meta.outputs.tag }} ${{ env.REGISTRY }}/lims-backend:latest
          docker push ${{ env.REGISTRY }}/lims-backend:latest

      - name: Build and push frontend
        run: |
          docker build -t ${{ env.REGISTRY }}/lims-frontend:${{ steps.meta.outputs.tag }} -f Dockerfile.frontend .
          docker push ${{ env.REGISTRY }}/lims-frontend:${{ steps.meta.outputs.tag }}
          docker tag ${{ env.REGISTRY }}/lims-frontend:${{ steps.meta.outputs.tag }} ${{ env.REGISTRY }}/lims-frontend:latest
          docker push ${{ env.REGISTRY }}/lims-frontend:latest

  # Production uses ArgoCD for GitOps deployment
  sync-argocd:
    name: Sync ArgoCD (GitOps)
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/download/v2.9.3/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Sync ArgoCD Application
        run: |
          # Login to ArgoCD
          argocd login ${{ secrets.ARGOCD_SERVER }} \
            --username admin \
            --password "${{ secrets.ARGOCD_AUTH_TOKEN }}" \
            --insecure \
            --grpc-web

          # Trigger sync with new image
          argocd app set lims \
            --parameter backend.image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --parameter frontend.image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --insecure \
            --grpc-web || true

          # Sync the application
          argocd app sync lims --insecure --grpc-web --force

          # Wait for sync operation to complete (not health - Ingress stays Progressing in k3s)
          argocd app wait lims --insecure --grpc-web --timeout 120 --operation || true

          # Get final status
          argocd app get lims --insecure --grpc-web

      - name: Verify deployments
        run: |
          # Setup kubeconfig for direct verification
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

          # Verify deployments rolled out successfully
          echo "Waiting for backend deployment..."
          kubectl rollout status deployment/lims-backend -n production --timeout=120s

          echo "Waiting for frontend deployment..."
          kubectl rollout status deployment/lims-frontend -n production --timeout=120s

          echo "✅ All deployments rolled out successfully"

          # Show pod status
          kubectl get pods -n production -l app.kubernetes.io/instance=lims

  smoke-tests:
    name: Production Smoke Tests
    runs-on: ubuntu-latest
    needs: sync-argocd

    steps:
      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Run smoke tests
        run: |
          echo "Running production smoke tests..."

          # Test backend health
          BACKEND_URL="http://100.89.26.128:30007"
          for i in {1..5}; do
            if curl -sf "$BACKEND_URL/health"; then
              echo "✅ Backend health check passed"
              break
            fi
            echo "Waiting for backend... ($i/5)"
            sleep 10
          done

          # Test frontend
          FRONTEND_URL="http://100.89.26.128:30005"
          if curl -sf "$FRONTEND_URL" > /dev/null; then
            echo "✅ Frontend check passed"
          else
            echo "⚠️ Frontend check pending"
          fi

          echo "Smoke tests completed"

      - name: Deployment summary
        run: |
          echo "## 🚀 Production Deployment Complete (GitOps)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Method:** ArgoCD (GitOps)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | https://lims.jagdevops.co.za |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend API | http://100.89.26.128:30007 |" >> $GITHUB_STEP_SUMMARY
          echo "| ArgoCD | http://100.89.26.128:30338 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`${{ needs.build-and-push.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [sync-argocd, smoke-tests]
    if: always()

    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.sync-argocd.result }}" == "success" ] && [ "${{ needs.smoke-tests.result }}" == "success" ]; then
            echo "✅ Production deployment successful (via ArgoCD)"
          else
            echo "❌ Production deployment failed"
            exit 1
          fi
