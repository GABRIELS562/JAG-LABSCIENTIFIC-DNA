name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  GHCR_REGISTRY: ghcr.io/gabriels562
  NAMESPACE: production

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install and build frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "1.0.0")
          TAG="v${VERSION}-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Image tag: $TAG"

      # Login to GitHub Container Registry (cloud backup + portfolio showcase)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure Docker for insecure registry
        run: |
          echo '{"insecure-registries": ["${{ env.REGISTRY }}"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sleep 5

      - name: Build and push backend
        run: |
          # Build the image
          docker build --no-cache -t lims-backend:${{ steps.meta.outputs.tag }} ./backend

          # Tag for on-prem registry (production deployment)
          docker tag lims-backend:${{ steps.meta.outputs.tag }} ${{ env.REGISTRY }}/lims-backend:${{ steps.meta.outputs.tag }}
          docker tag lims-backend:${{ steps.meta.outputs.tag }} ${{ env.REGISTRY }}/lims-backend:latest

          # Tag for GHCR (cloud backup + portfolio)
          docker tag lims-backend:${{ steps.meta.outputs.tag }} ${{ env.GHCR_REGISTRY }}/lims-backend:${{ steps.meta.outputs.tag }}
          docker tag lims-backend:${{ steps.meta.outputs.tag }} ${{ env.GHCR_REGISTRY }}/lims-backend:latest
          docker tag lims-backend:${{ steps.meta.outputs.tag }} ${{ env.GHCR_REGISTRY }}/lims-backend:production

          # Push to on-prem registry
          docker push ${{ env.REGISTRY }}/lims-backend:${{ steps.meta.outputs.tag }}
          docker push ${{ env.REGISTRY }}/lims-backend:latest

          # Push to GHCR
          docker push ${{ env.GHCR_REGISTRY }}/lims-backend:${{ steps.meta.outputs.tag }}
          docker push ${{ env.GHCR_REGISTRY }}/lims-backend:latest
          docker push ${{ env.GHCR_REGISTRY }}/lims-backend:production

      - name: Build and push frontend
        run: |
          # Build the image
          docker build -t lims-frontend:${{ steps.meta.outputs.tag }} -f Dockerfile.frontend .

          # Tag for on-prem registry (production deployment)
          docker tag lims-frontend:${{ steps.meta.outputs.tag }} ${{ env.REGISTRY }}/lims-frontend:${{ steps.meta.outputs.tag }}
          docker tag lims-frontend:${{ steps.meta.outputs.tag }} ${{ env.REGISTRY }}/lims-frontend:latest

          # Tag for GHCR (cloud backup + portfolio)
          docker tag lims-frontend:${{ steps.meta.outputs.tag }} ${{ env.GHCR_REGISTRY }}/lims-frontend:${{ steps.meta.outputs.tag }}
          docker tag lims-frontend:${{ steps.meta.outputs.tag }} ${{ env.GHCR_REGISTRY }}/lims-frontend:latest
          docker tag lims-frontend:${{ steps.meta.outputs.tag }} ${{ env.GHCR_REGISTRY }}/lims-frontend:production

          # Push to on-prem registry
          docker push ${{ env.REGISTRY }}/lims-frontend:${{ steps.meta.outputs.tag }}
          docker push ${{ env.REGISTRY }}/lims-frontend:latest

          # Push to GHCR
          docker push ${{ env.GHCR_REGISTRY }}/lims-frontend:${{ steps.meta.outputs.tag }}
          docker push ${{ env.GHCR_REGISTRY }}/lims-frontend:latest
          docker push ${{ env.GHCR_REGISTRY }}/lims-frontend:production

  # Production uses ArgoCD for GitOps deployment
  sync-argocd:
    name: Sync ArgoCD (GitOps)
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Log deployment info
        run: |
          echo "=== Deployment Info ==="
          echo "Image Tag: ${{ needs.build-and-push.outputs.image_tag }}"
          echo "Version: ${{ needs.build-and-push.outputs.version }}"
          echo "Using stable 'production' tag for deployment"
          echo "========================"

      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/download/v2.9.3/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Setup kubectl and ensure GHCR pull secret
        run: |
          # Setup kubeconfig
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

          # Create or update GHCR pull secret
          kubectl delete secret ghcr-pull-secret -n production --ignore-not-found
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace production \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --docker-email=ci@github.com

          echo "✅ GHCR pull secret created/updated"

          # Fix PostgreSQL if stuck in ImagePullBackOff
          PG_STATUS=$(kubectl get pod lims-postgresql-0 -n production -o jsonpath='{.status.phase}' 2>/dev/null || echo "NotFound")
          PG_IMAGE=$(kubectl get statefulset lims-postgresql -n production -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "unknown")

          if [[ "$PG_STATUS" != "Running" ]] || [[ "$PG_IMAGE" == *"ghcr.io"* ]]; then
            echo "⚠️ PostgreSQL needs repair (status: $PG_STATUS, image: $PG_IMAGE)"
            # Delete pod to trigger recreation with correct image after ArgoCD sync
            kubectl delete pod lims-postgresql-0 -n production --ignore-not-found --force --grace-period=0 || true
            echo "Deleted PostgreSQL pod for recreation"
          fi

          # Wait for PostgreSQL to be ready before continuing
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            PG_READY=$(kubectl get pod lims-postgresql-0 -n production -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
            if [[ "$PG_READY" == "true" ]]; then
              echo "✅ PostgreSQL is ready"
              break
            fi
            echo "PostgreSQL not ready yet ($i/30)..."
            sleep 10
          done

      - name: Sync ArgoCD Application
        run: |
          # Login to ArgoCD
          argocd login ${{ secrets.ARGOCD_SERVER }} \
            --username admin \
            --password "${{ secrets.ARGOCD_AUTH_TOKEN }}" \
            --insecure \
            --grpc-web

          # Wait for any existing operation to complete
          echo "Waiting for any existing sync to complete..."
          for i in {1..6}; do
            if argocd app wait lims --insecure --grpc-web --timeout 30 --operation 2>/dev/null; then
              echo "ArgoCD ready"
              break
            fi
            echo "Waiting... ($i/6)"
            sleep 10
          done

          # Refresh to pick up git changes
          argocd app get lims --refresh --insecure --grpc-web

          # Set rollout timestamp to force pod restart, then sync
          TIMESTAMP=$(date +%s)
          argocd app set lims \
            --insecure --grpc-web \
            -p backend.forceRollout=$TIMESTAMP \
            -p frontend.forceRollout=$TIMESTAMP

          # Sync the application
          argocd app sync lims --insecure --grpc-web --force

          # Wait for sync operation to complete
          argocd app wait lims --insecure --grpc-web --timeout 120 --operation || true

          # Get final status
          argocd app get lims --insecure --grpc-web

      - name: Force pod restart and verify
        run: |
          # Setup kubeconfig for direct verification
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

          # Delete ALL old backend pods to force fresh start with new image
          echo "Deleting all existing backend pods..."
          kubectl delete pods -n production -l app.kubernetes.io/component=backend --force --grace-period=0 || true
          kubectl delete pods -n production -l app.kubernetes.io/component=frontend --force --grace-period=0 || true

          # Wait briefly for new pods to be created
          sleep 10

          # Wait for rollouts to complete
          echo "Waiting for backend deployment..."
          kubectl rollout status deployment/lims-backend -n production --timeout=300s || {
            echo "⚠️ Backend rollout timeout - checking pod status"
            kubectl get pods -n production -l app.kubernetes.io/component=backend
            kubectl describe deployment/lims-backend -n production | tail -20
          }

          echo "Waiting for frontend deployment..."
          kubectl rollout status deployment/lims-frontend -n production --timeout=300s || {
            echo "⚠️ Frontend rollout timeout - checking pod status"
            kubectl get pods -n production -l app=lims-frontend
          }

          echo "✅ Deployment verification complete"

          # Show pod status
          kubectl get pods -n production -l app.kubernetes.io/instance=lims

  smoke-tests:
    name: Production Smoke Tests
    runs-on: ubuntu-latest
    needs: sync-argocd

    steps:
      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Run smoke tests
        run: |
          echo "Running production smoke tests..."

          # Test backend health
          BACKEND_URL="http://100.89.26.128:30007"
          for i in {1..5}; do
            if curl -sf "$BACKEND_URL/health"; then
              echo "✅ Backend health check passed"
              break
            fi
            echo "Waiting for backend... ($i/5)"
            sleep 10
          done

          # Test frontend
          FRONTEND_URL="http://100.89.26.128:30005"
          if curl -sf "$FRONTEND_URL" > /dev/null; then
            echo "✅ Frontend check passed"
          else
            echo "⚠️ Frontend check pending"
          fi

          echo "Smoke tests completed"

      - name: Deployment summary
        run: |
          echo "## 🚀 Production Deployment Complete (GitOps)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Method:** ArgoCD (GitOps)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Application URLs" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | https://lims.jagdevops.co.za |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend API | http://100.89.26.128:30007 |" >> $GITHUB_STEP_SUMMARY
          echo "| ArgoCD | http://100.89.26.128:30338 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Container Images" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Registry |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | \`ghcr.io/${{ github.repository_owner }}/lims-backend:${{ needs.build-and-push.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | \`ghcr.io/${{ github.repository_owner }}/lims-frontend:${{ needs.build-and-push.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`${{ needs.build-and-push.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [build-and-push, sync-argocd, smoke-tests]
    if: always()

    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.sync-argocd.result }}" == "success" ] && [ "${{ needs.smoke-tests.result }}" == "success" ]; then
            echo "✅ Production deployment successful (via ArgoCD)"
            echo "📦 Images pushed to GHCR: ghcr.io/${{ github.repository_owner }}/lims-*"
          else
            echo "❌ Production deployment failed"
            exit 1
          fi
