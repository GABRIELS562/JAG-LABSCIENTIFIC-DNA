name: Build and Deploy LIMS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install --force

    - name: Install backend dependencies
      run: cd backend && npm install --force

    - name: Build frontend
      run: npm run build

    - name: Run tests (if available)
      run: npm test --if-present
      continue-on-error: true

  build-and-push-images:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.DOCKER_REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_REGISTRY }}/lims-backend:${{ github.sha }}
          ${{ secrets.DOCKER_REGISTRY }}/lims-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./frontend/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_REGISTRY }}/lims-frontend:${{ github.sha }}
          ${{ secrets.DOCKER_REGISTRY }}/lims-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  update-manifests:
    needs: build-and-push-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Update Kubernetes manifests
      run: |
        # Update image tags in Kubernetes manifests
        sed -i "s|image: .*/lims-backend:.*|image: ${{ secrets.DOCKER_REGISTRY }}/lims-backend:${{ github.sha }}|g" k8s/backend.yaml
        sed -i "s|image: .*/lims-frontend:.*|image: ${{ secrets.DOCKER_REGISTRY }}/lims-frontend:${{ github.sha }}|g" k8s/frontend.yaml

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add k8s/backend.yaml k8s/frontend.yaml
        git diff --staged --quiet || (git commit -m "Update image tags to ${{ github.sha }}" && git push)

  deploy-to-staging:
    needs: update-manifests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: staging

    steps:
    - name: Deploy to Server2 (staging)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER2_HOST }}
        username: ${{ secrets.SERVER2_USERNAME }}
        key: ${{ secrets.SERVER2_SSH_KEY }}
        script: |
          cd /path/to/lims
          git pull origin main
          docker-compose down
          docker-compose pull
          docker-compose up -d
          echo "Deployed to staging successfully"

  sync-argocd:
    needs: update-manifests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Sync ArgoCD Application
      uses: clowdhaus/argo-cd-action/@main
      with:
        version: 2.8.4
        command: app sync
        options: |
          --server ${{ secrets.ARGOCD_SERVER }}
          --auth-token ${{ secrets.ARGOCD_TOKEN }}
          --insecure
          lims

    - name: Wait for ArgoCD Deployment
      uses: clowdhaus/argo-cd-action/@main
      with:
        version: 2.8.4
        command: app wait
        options: |
          --server ${{ secrets.ARGOCD_SERVER }}
          --auth-token ${{ secrets.ARGOCD_TOKEN }}
          --insecure
          --timeout 300
          lims

  notify:
    needs: [sync-argocd, deploy-to-staging]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Notify deployment status
      run: |
        if [ "${{ needs.sync-argocd.result }}" == "success" ] && [ "${{ needs.deploy-to-staging.result }}" == "success" ]; then
          echo "✅ Deployment successful to both staging and production"
        else
          echo "❌ Deployment failed. Check logs for details."
          exit 1
        fi