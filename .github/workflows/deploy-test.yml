name: Deploy to Test

on:
  push:
    branches:
      - 'feature/**'
      - 'feature/*'

env:
  REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  GHCR_REGISTRY: ghcr.io/gabriels562
  NAMESPACE: test

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install and build frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          SAFE_BRANCH=$(echo $BRANCH_NAME | sed 's/\//-/g')
          TAG="${SAFE_BRANCH}-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $TAG"

      # Login to GitHub Container Registry (cloud backup + portfolio showcase)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure Docker for insecure registry
        run: |
          echo '{"insecure-registries": ["${{ env.REGISTRY }}"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sleep 5

      - name: Build and push backend
        run: |
          # Build the image
          docker build -t lims-backend:${{ steps.meta.outputs.tag }} ./backend

          # Tag for on-prem registry (K8s deployment)
          docker tag lims-backend:${{ steps.meta.outputs.tag }} ${{ env.REGISTRY }}/lims-backend:${{ steps.meta.outputs.tag }}
          docker tag lims-backend:${{ steps.meta.outputs.tag }} ${{ env.REGISTRY }}/lims-backend:test-latest

          # Tag for GHCR (cloud backup + portfolio)
          docker tag lims-backend:${{ steps.meta.outputs.tag }} ${{ env.GHCR_REGISTRY }}/lims-backend:${{ steps.meta.outputs.tag }}
          docker tag lims-backend:${{ steps.meta.outputs.tag }} ${{ env.GHCR_REGISTRY }}/lims-backend:test

          # Push to on-prem registry
          docker push ${{ env.REGISTRY }}/lims-backend:${{ steps.meta.outputs.tag }}
          docker push ${{ env.REGISTRY }}/lims-backend:test-latest

          # Push to GHCR
          docker push ${{ env.GHCR_REGISTRY }}/lims-backend:${{ steps.meta.outputs.tag }}
          docker push ${{ env.GHCR_REGISTRY }}/lims-backend:test

      - name: Build and push frontend
        run: |
          # Build the image
          docker build -t lims-frontend:${{ steps.meta.outputs.tag }} -f Dockerfile.frontend .

          # Tag for on-prem registry (K8s deployment)
          docker tag lims-frontend:${{ steps.meta.outputs.tag }} ${{ env.REGISTRY }}/lims-frontend:${{ steps.meta.outputs.tag }}
          docker tag lims-frontend:${{ steps.meta.outputs.tag }} ${{ env.REGISTRY }}/lims-frontend:test-latest

          # Tag for GHCR (cloud backup + portfolio)
          docker tag lims-frontend:${{ steps.meta.outputs.tag }} ${{ env.GHCR_REGISTRY }}/lims-frontend:${{ steps.meta.outputs.tag }}
          docker tag lims-frontend:${{ steps.meta.outputs.tag }} ${{ env.GHCR_REGISTRY }}/lims-frontend:test

          # Push to on-prem registry
          docker push ${{ env.REGISTRY }}/lims-frontend:${{ steps.meta.outputs.tag }}
          docker push ${{ env.REGISTRY }}/lims-frontend:test-latest

          # Push to GHCR
          docker push ${{ env.GHCR_REGISTRY }}/lims-frontend:${{ steps.meta.outputs.tag }}
          docker push ${{ env.GHCR_REGISTRY }}/lims-frontend:test

  deploy:
    name: Deploy to Test Namespace
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update Helm dependencies
        run: |
          cd helm/lims
          helm dependency update

      - name: Deploy with Helm
        run: |
          # Deploy without --wait to avoid timeout issues
          helm upgrade --install lims-test ./helm/lims \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            -f helm/lims/values-test.yaml \
            --set backend.image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --set frontend.image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --timeout 8m

          # Wait for deployments separately with better feedback
          echo "Waiting for backend deployment..."
          kubectl rollout status deployment/lims-test-backend -n ${{ env.NAMESPACE }} --timeout=180s || true

          echo "Waiting for frontend deployment..."
          kubectl rollout status deployment/lims-test-frontend -n ${{ env.NAMESPACE }} --timeout=180s || true

      - name: Verify deployment
        run: |
          echo "Verifying pods are running..."
          kubectl get pods -n ${{ env.NAMESPACE }} -l app.kubernetes.io/instance=lims-test

          echo "Testing backend health endpoint..."
          for i in {1..5}; do
            if curl -sf http://100.89.26.128:30101/health; then
              echo "Backend is healthy"
              break
            fi
            echo "Waiting for backend... ($i/5)"
            sleep 10
          done

          echo "Testing frontend..."
          curl -sI http://100.89.26.128:30102 | head -3 || true

      - name: Get deployment info
        run: |
          echo "## 🧪 Test Deployment Info" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Application URLs" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend API | http://100.89.26.128:30101 |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | http://100.89.26.128:30102 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Container Images" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Registry |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | \`ghcr.io/${{ github.repository_owner }}/lims-backend:${{ needs.build-and-push.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | \`ghcr.io/${{ github.repository_owner }}/lims-frontend:${{ needs.build-and-push.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Namespace:** \`${{ env.NAMESPACE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`${{ needs.build-and-push.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Test Deployment Ready

              | Resource | URL |
              |----------|-----|
              | Frontend | http://100.89.26.128:30102 |
              | Backend API | http://100.89.26.128:30101 |

              ### 📦 Container Images (GHCR)
              - Backend: \`ghcr.io/${{ github.repository_owner }}/lims-backend:${{ needs.build-and-push.outputs.image_tag }}\`
              - Frontend: \`ghcr.io/${{ github.repository_owner }}/lims-frontend:${{ needs.build-and-push.outputs.image_tag }}\`

              **Image Tag:** \`${{ needs.build-and-push.outputs.image_tag }}\`
              **Namespace:** \`test\``
            })
