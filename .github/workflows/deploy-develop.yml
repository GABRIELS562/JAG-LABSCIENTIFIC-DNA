name: Deploy to Develop

on:
  push:
    branches:
      - develop

env:
  REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  GHCR_REGISTRY: ghcr.io/${{ github.repository_owner }}
  NAMESPACE: develop

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install and build frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        run: |
          TAG="develop-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $TAG"

      # Login to GitHub Container Registry (cloud backup + portfolio showcase)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure Docker for insecure registry
        run: |
          echo '{"insecure-registries": ["${{ env.REGISTRY }}"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sleep 5

      - name: Build and push backend
        run: |
          # Build the image
          docker build -t lims-backend:${{ steps.meta.outputs.tag }} ./backend

          # Tag for on-prem registry (K8s deployment)
          docker tag lims-backend:${{ steps.meta.outputs.tag }} ${{ env.REGISTRY }}/lims-backend:${{ steps.meta.outputs.tag }}
          docker tag lims-backend:${{ steps.meta.outputs.tag }} ${{ env.REGISTRY }}/lims-backend:develop-latest

          # Tag for GHCR (cloud backup + portfolio)
          docker tag lims-backend:${{ steps.meta.outputs.tag }} ${{ env.GHCR_REGISTRY }}/lims-backend:${{ steps.meta.outputs.tag }}
          docker tag lims-backend:${{ steps.meta.outputs.tag }} ${{ env.GHCR_REGISTRY }}/lims-backend:develop

          # Push to on-prem registry
          docker push ${{ env.REGISTRY }}/lims-backend:${{ steps.meta.outputs.tag }}
          docker push ${{ env.REGISTRY }}/lims-backend:develop-latest

          # Push to GHCR
          docker push ${{ env.GHCR_REGISTRY }}/lims-backend:${{ steps.meta.outputs.tag }}
          docker push ${{ env.GHCR_REGISTRY }}/lims-backend:develop

      - name: Build and push frontend
        run: |
          # Build the image
          docker build -t lims-frontend:${{ steps.meta.outputs.tag }} -f Dockerfile.frontend .

          # Tag for on-prem registry (K8s deployment)
          docker tag lims-frontend:${{ steps.meta.outputs.tag }} ${{ env.REGISTRY }}/lims-frontend:${{ steps.meta.outputs.tag }}
          docker tag lims-frontend:${{ steps.meta.outputs.tag }} ${{ env.REGISTRY }}/lims-frontend:develop-latest

          # Tag for GHCR (cloud backup + portfolio)
          docker tag lims-frontend:${{ steps.meta.outputs.tag }} ${{ env.GHCR_REGISTRY }}/lims-frontend:${{ steps.meta.outputs.tag }}
          docker tag lims-frontend:${{ steps.meta.outputs.tag }} ${{ env.GHCR_REGISTRY }}/lims-frontend:develop

          # Push to on-prem registry
          docker push ${{ env.REGISTRY }}/lims-frontend:${{ steps.meta.outputs.tag }}
          docker push ${{ env.REGISTRY }}/lims-frontend:develop-latest

          # Push to GHCR
          docker push ${{ env.GHCR_REGISTRY }}/lims-frontend:${{ steps.meta.outputs.tag }}
          docker push ${{ env.GHCR_REGISTRY }}/lims-frontend:develop

  deploy:
    name: Deploy to Develop Namespace
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: develop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update Helm dependencies
        run: |
          cd helm/lims
          helm dependency update

      - name: Deploy with Helm
        run: |
          # Deploy without --wait to avoid timeout issues
          helm upgrade --install lims-develop ./helm/lims \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            -f helm/lims/values-develop.yaml \
            --set backend.image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --set frontend.image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --timeout 8m

          # Wait for deployments separately
          echo "Waiting for backend deployment..."
          kubectl rollout status deployment/lims-develop-backend -n ${{ env.NAMESPACE }} --timeout=180s || true

          echo "Waiting for frontend deployment..."
          kubectl rollout status deployment/lims-develop-frontend -n ${{ env.NAMESPACE }} --timeout=180s || true

      - name: Verify deployment
        run: |
          echo "Verifying pods are running..."
          kubectl get pods -n ${{ env.NAMESPACE }} -l app.kubernetes.io/instance=lims-develop

      - name: Run smoke tests
        run: |
          BACKEND_URL="http://100.89.26.128:30201"
          echo "Testing backend health..."
          curl -sf "$BACKEND_URL/health" || echo "Health check pending..."
          echo "Smoke tests completed"

      - name: Get deployment info
        run: |
          echo "## 🔧 Develop Deployment Info" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Application URLs" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend API | http://100.89.26.128:30201 |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | http://100.89.26.128:30202 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Container Images" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Registry |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | \`ghcr.io/${{ github.repository_owner }}/lims-backend:${{ needs.build-and-push.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | \`ghcr.io/${{ github.repository_owner }}/lims-frontend:${{ needs.build-and-push.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Namespace:** \`${{ env.NAMESPACE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`${{ needs.build-and-push.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
