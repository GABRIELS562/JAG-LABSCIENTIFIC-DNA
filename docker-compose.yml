version: '3.8'

# Local development and testing setup with PostgreSQL
services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: lims-postgres-local
    environment:
      POSTGRES_DB: lims_db
      POSTGRES_USER: lims_user
      POSTGRES_PASSWORD: lims_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lims_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lims_user -d lims_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lims-backend-local
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=lims_db
      - DATABASE_USER=lims_user
      - DATABASE_PASSWORD=lims_password
      - ENABLE_MOCK_SAMPLES=true
      - SAMPLE_CYCLE_INTERVAL=30000
    volumes:
      - ./backend:/app
      - /app/node_modules
      - lims_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lims_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["node", "server.js"]

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: lims-frontend-local
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - lims_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: lims-redis-local
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lims_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  lims_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  lims_logs:
    driver: local
  redis_data:
    driver: local