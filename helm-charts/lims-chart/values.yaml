replicaCount: 2

image:
  repository: localhost:5000/jagdna-lims
  tag: "v1.0.3"
  pullPolicy: Always

service:
  type: NodePort
  port: 3001
  targetPort: 3001
  nodePort: 30003  # Production uses 30003

nameOverride: ""
fullnameOverride: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

ingress:
  enabled: false

forensics:
  labName: "JAGDNA Scientific"
  isoCompliance: "17025:2017"
  workflowStages:
    - sample_collected
    - extraction_ready
    - extraction_in_progress
    - pcr_ready
    - pcr_completed
    - electro_ready
    - analysis_ready
    - report_ready