version: '3.8'

services:
  locust-master:
    image: locustio/locust:2.20.0
    container_name: locust-master
    ports:
      - "8089:8089"  # Web UI
      - "5557:5557"  # Master communication
    volumes:
      - ./:/mnt/locust
    command: >
      -f /mnt/locust/locustfile.py
      --master
      --host=${TARGET_HOST:-http://100.89.26.128:30007}
      --web-host=0.0.0.0
    environment:
      - TARGET_HOST=${TARGET_HOST:-http://100.89.26.128:30007}
      - LOCUST_USERS=${LOCUST_USERS:-10}
      - LOCUST_SPAWN_RATE=${LOCUST_SPAWN_RATE:-1}
    networks:
      - locust-net

  locust-worker:
    image: locustio/locust:2.20.0
    volumes:
      - ./:/mnt/locust
    command: >
      -f /mnt/locust/locustfile.py
      --worker
      --master-host=locust-master
    environment:
      - TARGET_HOST=${TARGET_HOST:-http://100.89.26.128:30007}
    depends_on:
      - locust-master
    deploy:
      replicas: 2
    networks:
      - locust-net

  # Prometheus exporter for Locust metrics
  locust-exporter:
    image: containersol/locust_exporter:v0.5.0
    container_name: locust-exporter
    ports:
      - "9646:9646"
    environment:
      - LOCUST_EXPORTER_URI=http://locust-master:8089
    depends_on:
      - locust-master
    networks:
      - locust-net

networks:
  locust-net:
    driver: bridge
