# Application Alert Rules
groups:
  - name: app-health
    interval: 30s
    rules:
      # App Down Alert
      - alert: AppDown
        expr: up{job=~"lims.*|portfolio-apps"} == 0
        for: 2m
        labels:
          severity: critical
          team: devops
        annotations:
          summary: "Application {{ $labels.job }} is down"
          description: "{{ $labels.instance }} has been down for more than 2 minutes."
          runbook_url: "https://wiki.example.com/runbooks/app-down"

      # High Error Rate
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[5m])) by (job)
            /
            sum(rate(http_requests_total[5m])) by (job)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "Error rate is {{ $value | humanizePercentage }} on {{ $labels.job }}"

      # High Latency
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job)
          ) > 2
        for: 5m
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "High latency on {{ $labels.job }}"
          description: "95th percentile latency is {{ $value }}s on {{ $labels.job }}"

  - name: lims-specific
    interval: 30s
    rules:
      # LIMS Workflow Queue Buildup
      - alert: LIMSQueueBacklog
        expr: lims_queue_size{queue_type="analysis_ready"} > 50
        for: 10m
        labels:
          severity: warning
          team: lab-ops
        annotations:
          summary: "LIMS analysis queue is backing up"
          description: "Analysis queue has {{ $value }} samples waiting"

      # LIMS Samples Not Progressing
      - alert: LIMSWorkflowStalled
        expr: |
          increase(lims_active_workflows{stage="report_sent"}[1h]) == 0
          and
          sum(lims_active_workflows) > 0
        for: 30m
        labels:
          severity: warning
          team: lab-ops
        annotations:
          summary: "LIMS workflow appears stalled"
          description: "No samples have completed workflow in the last hour"

      # LIMS Database Connection Issues
      - alert: LIMSDatabaseConnectionLow
        expr: lims_database_connections < 2
        for: 5m
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "LIMS database connections low"
          description: "Only {{ $value }} database connections available"

  - name: pod-health
    interval: 30s
    rules:
      # Pod Restart Loop
      - alert: PodRestartLoop
        expr: |
          increase(kube_pod_container_status_restarts_total[5m]) > 3
        for: 5m
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "Pod {{ $labels.pod }} is in restart loop"
          description: "Pod has restarted {{ $value }} times in the last 5 minutes"

      # High Memory Usage
      - alert: PodHighMemoryUsage
        expr: |
          (
            container_memory_usage_bytes{container!=""}
            /
            container_spec_memory_limit_bytes{container!=""}
          ) > 0.8
        for: 5m
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "Pod {{ $labels.pod }} high memory usage"
          description: "Memory usage is {{ $value | humanizePercentage }}"
