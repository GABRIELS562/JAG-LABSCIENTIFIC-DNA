apiVersion: apps/v1
kind: Deployment
metadata:
  name: lims-complete
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lims-complete
  template:
    metadata:
      labels:
        app: lims-complete
    spec:
      containers:
      - name: lims
        image: localhost:5000/lims-full:latest
        ports:
        - containerPort: 5173
          name: frontend
        - containerPort: 3001
          name: backend
        env:
        - name: VITE_API_URL
          value: "http://localhost:3001"
---
apiVersion: v1
kind: Service
metadata:
  name: lims-complete-service
  namespace: production
spec:
  type: NodePort
  selector:
    app: lims-complete
  ports:
  - name: frontend
    port: 5173
    targetPort: 5173
    nodePort: 30007
