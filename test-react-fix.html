<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>React Build Test</title>
</head>
<body>
    <h1>Testing React Build Fix</h1>
    <div id="test-results"></div>

    <script>
        const results = document.getElementById('test-results');
        let errors = [];
        let logs = [];

        // Capture console errors
        window.addEventListener('error', (e) => {
            errors.push(`ERROR: ${e.message} at ${e.filename}:${e.lineno}:${e.colno}`);
            updateResults();
        });

        // Capture unhandled promise rejections
        window.addEventListener('unhandledrejection', (e) => {
            errors.push(`PROMISE REJECTION: ${e.reason}`);
            updateResults();
        });

        // Override console methods to capture logs
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;

        console.log = function(...args) {
            logs.push(`LOG: ${args.join(' ')}`);
            originalLog.apply(console, args);
            updateResults();
        };

        console.error = function(...args) {
            errors.push(`CONSOLE ERROR: ${args.join(' ')}`);
            originalError.apply(console, args);
            updateResults();
        };

        console.warn = function(...args) {
            logs.push(`WARN: ${args.join(' ')}`);
            originalWarn.apply(console, args);
            updateResults();
        };

        function updateResults() {
            let html = '<h2>Test Results:</h2>';

            if (errors.length > 0) {
                html += '<h3 style="color: red;">❌ Errors Found:</h3>';
                html += '<ul>';
                errors.forEach(err => {
                    html += `<li style="color: red;">${err}</li>`;
                });
                html += '</ul>';
            } else {
                html += '<h3 style="color: green;">✅ No Errors!</h3>';
            }

            html += '<h3>Logs:</h3>';
            html += '<ul>';
            logs.forEach(log => {
                html += `<li>${log}</li>`;
            });
            html += '</ul>';

            html += '<h3>React Status:</h3>';
            html += '<ul>';
            html += `<li>window.React exists: ${typeof window.React !== 'undefined' ? '✅ YES' : '❌ NO'}</li>`;
            html += `<li>window.ReactDOM exists: ${typeof window.ReactDOM !== 'undefined' ? '✅ YES' : '❌ NO'}</li>`;
            if (typeof window.React !== 'undefined') {
                html += `<li>React.useLayoutEffect exists: ${typeof window.React.useLayoutEffect !== 'undefined' ? '✅ YES' : '❌ NO'}</li>`;
            }
            html += '</ul>';

            results.innerHTML = html;
        }

        // Load the app in an iframe to test
        setTimeout(() => {
            const iframe = document.createElement('iframe');
            iframe.src = 'http://localhost:5001';
            iframe.style.width = '100%';
            iframe.style.height = '600px';
            iframe.style.border = '2px solid #ccc';
            iframe.onload = () => {
                logs.push('App iframe loaded successfully');
                updateResults();
            };
            iframe.onerror = (e) => {
                errors.push('Failed to load app iframe');
                updateResults();
            };
            document.body.appendChild(iframe);
        }, 1000);

        // Initial update
        updateResults();
    </script>
</body>
</html>
