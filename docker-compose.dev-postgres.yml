# Development PostgreSQL Setup
# Use this for local development instead of SQLite
version: '3.8'

services:
  postgres-dev:
    image: postgres:15-alpine
    container_name: lims-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: jagdna_lims_dev
      POSTGRES_USER: lims_dev
      POSTGRES_PASSWORD: dev_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./backend/database/init-dev.sql:/docker-entrypoint-initdb.d/init-dev.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lims_dev -d jagdna_lims_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lims-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@jagdna.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres-dev
    profiles:
      - admin

volumes:
  postgres_dev_data:
    driver: local