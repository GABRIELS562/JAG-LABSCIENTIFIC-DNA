<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Test</title>
</head>
<body>
    <h1>Testing Dashboard API Connection</h1>
    <div id="status"></div>
    <div id="tracker"></div>
    
    <script>
        async function testAPI() {
            const statusDiv = document.getElementById('status');
            const trackerDiv = document.getElementById('tracker');
            
            try {
                // Test paternity workflow endpoint
                const response = await fetch('http://localhost:3001/api/workflow/paternity/status');
                const data = await response.json();
                
                if (data.success) {
                    statusDiv.innerHTML = '<h2 style="color: green;">✅ API Working!</h2>';
                    
                    // Display workflow data
                    let html = '<h3>Live Paternity Workflow Status:</h3>';
                    html += `<p>Status: ${data.data.status}</p>`;
                    html += `<p>Total Samples: ${data.data.totalSamples}</p>`;
                    html += `<p>Cycles Completed: ${data.data.cyclesCompleted}</p>`;
                    html += '<h4>Stage Distribution:</h4><ul>';
                    
                    data.data.stageDistribution.forEach(stage => {
                        html += `<li>${stage.workflow_status}: ${stage.count} samples</li>`;
                    });
                    html += '</ul>';
                    
                    trackerDiv.innerHTML = html;
                } else {
                    statusDiv.innerHTML = '<h2 style="color: red;">❌ API Error</h2>';
                }
            } catch (error) {
                statusDiv.innerHTML = `<h2 style="color: red;">❌ Connection Error: ${error.message}</h2>`;
            }
        }
        
        // Test immediately and every 5 seconds
        testAPI();
        setInterval(testAPI, 5000);
    </script>
</body>
</html>
