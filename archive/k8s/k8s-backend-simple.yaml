# Simplified Backend Deployment without health checks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jagdna-backend
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jagdna-backend
  template:
    metadata:
      labels:
        app: jagdna-backend
    spec:
      volumes:
      - name: database-storage
        persistentVolumeClaim:
          claimName: jagdna-database-pvc
      - name: shared-data
        emptyDir: {}
      containers:
      - name: backend
        image: jagdna-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3001
        volumeMounts:
        - name: database-storage
          mountPath: /app/data
        - name: shared-data
          mountPath: /app/uploads
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_PATH
          value: "/app/data/forensics.db"
        - name: UPLOAD_DIR
          value: "/app/uploads"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: jagdna-backend-service
  namespace: production
spec:
  selector:
    app: jagdna-backend
  ports:
  - port: 3001
    targetPort: 3001
  type: ClusterIP