# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jagdna-frontend
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jagdna-frontend
  template:
    metadata:
      labels:
        app: jagdna-frontend
    spec:
      containers:
      - name: frontend
        image: jagdna-frontend:clean
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: jagdna-frontend-service
  namespace: production
spec:
  selector:
    app: jagdna-frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jagdna-ingress
  namespace: production
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jagdna-frontend-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: jagdna-backend-service
            port:
              number: 3001