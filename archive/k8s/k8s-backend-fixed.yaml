# Backend Deployment with simplified health checks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jagdna-backend
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jagdna-backend
  template:
    metadata:
      labels:
        app: jagdna-backend
    spec:
      volumes:
      - name: database-storage
        persistentVolumeClaim:
          claimName: jagdna-database-pvc
      - name: shared-data
        emptyDir: {}
      initContainers:
      - name: init-database
        image: localhost:5000/jagdna-backend:production
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Initializing database..."
          mkdir -p /app/data
          mkdir -p /app/database
          touch /app/data/forensics.db
          touch /app/database/ashley_lims.db
          echo "Database files created"
        volumeMounts:
        - name: database-storage
          mountPath: /app/data
      containers:
      - name: backend
        image: localhost:5000/jagdna-backend:production
        ports:
        - containerPort: 3001
        volumeMounts:
        - name: database-storage
          mountPath: /app/data
        - name: database-storage
          mountPath: /app/database
        - name: shared-data
          mountPath: /app/uploads
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_PATH
          value: "/app/data/forensics.db"
        - name: UPLOAD_DIR
          value: "/app/uploads"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3001
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: jagdna-backend-service
  namespace: production
spec:
  selector:
    app: jagdna-backend
  ports:
  - port: 3001
    targetPort: 3001
  type: ClusterIP