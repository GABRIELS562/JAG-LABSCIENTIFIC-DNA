# PersistentVolume for SQLite database
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jagdna-database-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany  # Multiple pods need access
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /home/jaime/jagdna-database  # Host path for database storage
---
# PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jagdna-database-pvc
  namespace: production
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: manual
  resources:
    requests:
      storage: 5Gi