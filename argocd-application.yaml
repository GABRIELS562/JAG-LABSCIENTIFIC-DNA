apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lims-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/GABRIELS562/JAG-LABSCIENTIFIC-DNA
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
