<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" fill="#0D488F" rx="64"/>

  <!-- DNA Helix -->
  <g transform="translate(256, 256)">
    <!-- Central strand -->
    <path d="M -60 -180 Q -30 -90, 0 0 Q 30 90, 60 180"
          stroke="#ffffff" stroke-width="12" fill="none" opacity="0.9"/>
    <path d="M 60 -180 Q 30 -90, 0 0 Q -30 90, -60 180"
          stroke="#ffffff" stroke-width="12" fill="none" opacity="0.9"/>

    <!-- Connection bars -->
    <line x1="-50" y1="-150" x2="50" y2="-150" stroke="#4FC3F7" stroke-width="8"/>
    <line x1="-40" y1="-100" x2="40" y2="-100" stroke="#81C784" stroke-width="8"/>
    <line x1="-30" y1="-50" x2="30" y2="-50" stroke="#FFB74D" stroke-width="8"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#E57373" stroke-width="8"/>
    <line x1="-30" y1="50" x2="30" y2="50" stroke="#4FC3F7" stroke-width="8"/>
    <line x1="-40" y1="100" x2="40" y2="100" stroke="#81C784" stroke-width="8"/>
    <line x1="-50" y1="150" x2="50" y2="150" stroke="#FFB74D" stroke-width="8"/>

    <!-- Nodes -->
    <circle cx="-50" cy="-150" r="10" fill="#ffffff"/>
    <circle cx="50" cy="-150" r="10" fill="#ffffff"/>
    <circle cx="-40" cy="-100" r="10" fill="#ffffff"/>
    <circle cx="40" cy="-100" r="10" fill="#ffffff"/>
    <circle cx="-30" cy="-50" r="10" fill="#ffffff"/>
    <circle cx="30" cy="-50" r="10" fill="#ffffff"/>
    <circle cx="-20" cy="0" r="10" fill="#ffffff"/>
    <circle cx="20" cy="0" r="10" fill="#ffffff"/>
    <circle cx="-30" cy="50" r="10" fill="#ffffff"/>
    <circle cx="30" cy="50" r="10" fill="#ffffff"/>
    <circle cx="-40" cy="100" r="10" fill="#ffffff"/>
    <circle cx="40" cy="100" r="10" fill="#ffffff"/>
    <circle cx="-50" cy="150" r="10" fill="#ffffff"/>
    <circle cx="50" cy="150" r="10" fill="#ffffff"/>
  </g>

  <!-- JAG Text -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="72" font-weight="bold"
        fill="#ffffff" text-anchor="middle">JAG</text>
</svg>