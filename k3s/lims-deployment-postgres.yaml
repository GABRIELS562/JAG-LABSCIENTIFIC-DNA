# Complete LIMS Deployment with PostgreSQL Integration
# Updated for correct database credentials and environment variables

---
apiVersion: v1
kind: Secret
metadata:
  name: lims-db-secret
  namespace: production
  labels:
    app: jagdna-lims
type: Opaque
data:
  # Base64 encoded database credentials matching requirements
  DB_HOST: cG9zdGdyZXNxbC5wcm9kdWN0aW9uLnN2Yy5jbHVzdGVyLmxvY2Fs  # postgresql.production.svc.cluster.local
  DB_PORT: NTQzMg==  # 5432
  DB_USER: bGltc191c2Vy  # lims_user
  DB_PASSWORD: bGltczIwMjRzZWN1cmU=  # lims2024secure
  DB_NAME: bGltc2Ri  # limsdb
  DATABASE_URL: cG9zdGdyZXNxbDovL2xpbXNfdXNlcjpsaW1zMjAyNHNlY3VyZUBwb3N0Z3Jlc3FsLnByb2R1Y3Rpb24uc3ZjLmNsdXN0ZXIubG9jYWw6NTQzMi9saW1zZGI=  # postgresql://lims_user:lims2024secure@postgresql.production.svc.cluster.local:5432/limsdb

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jagdna-lims-backend
  namespace: production
  labels:
    app: jagdna-lims
    component: backend
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jagdna-lims
      component: backend
  template:
    metadata:
      labels:
        app: jagdna-lims
        component: backend
        environment: production
    spec:
      containers:
      - name: lims-backend
        image: jagdna-lims:postgres
        imagePullPolicy: Never
        ports:
        - containerPort: 3001
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        # Database configuration from secrets
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: lims-db-secret
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: lims-db-secret
              key: DB_PORT
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: lims-db-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lims-db-secret
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: lims-db-secret
              key: DB_NAME
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: lims-db-secret
              key: DATABASE_URL
        # Legacy PostgreSQL environment variables (for backward compatibility)
        - name: POSTGRES_HOST
          value: "postgresql.production.svc.cluster.local"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: "lims_user"
        - name: POSTGRES_PASSWORD
          value: "lims2024secure"
        - name: POSTGRES_DB
          value: "limsdb"
        # Application configuration
        - name: ENABLE_DEVOPS_FEATURES
          value: "true"
        - name: ENABLE_WORKFLOW_AUTOMATION
          value: "true"
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        volumeMounts:
        - name: uploads-storage
          mountPath: /app/backend/uploads
        - name: logs-storage
          mountPath: /app/backend/logs
      volumes:
      - name: uploads-storage
        persistentVolumeClaim:
          claimName: lims-uploads-pvc
      - name: logs-storage
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: jagdna-lims-backend
  namespace: production
  labels:
    app: jagdna-lims
    component: backend
spec:
  selector:
    app: jagdna-lims
    component: backend
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
  type: ClusterIP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lims-uploads-pvc
  namespace: production
  labels:
    app: jagdna-lims
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path