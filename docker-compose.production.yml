version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-bookworm
    container_name: lims-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: limsdb
      POSTGRES_USER: lims_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lims2024secure}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/database/postgres-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/init-postgres-tables.sql:/docker-entrypoint-initdb.d/02-tables.sql:ro
    ports:
      - "5432:5432"
    networks:
      - lims-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lims_user -d limsdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LIMS Application
  lims-app:
    build:
      context: .
      dockerfile: Dockerfile.production
      args:
        NODE_ENV: production
    image: jag-lims:production
    container_name: lims-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database configuration
      DB_ADAPTER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: limsdb
      DB_USER: lims_user
      DB_PASSWORD: ${DB_PASSWORD:-lims2024secure}
      DATABASE_URL: postgresql://lims_user:${DB_PASSWORD:-lims2024secure}@postgres:5432/limsdb
      
      # Application settings
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      
      # Security
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-secure-random-secret}
      JWT_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 10
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE_PATH: /app/backend/logs
      
      # Performance
      NODE_OPTIONS: "--max-old-space-size=1024"
      DATABASE_POOL_MIN: 2
      DATABASE_POOL_MAX: 20
      
      # Features
      ENABLE_HEALTH_CHECK: true
      ENABLE_METRICS: true
      ENABLE_WORKFLOW_AUTOMATION: true
      WORKFLOW_CYCLE_INTERVAL: 30000
      SAMPLE_BATCH_SIZE: 5
      
      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      CORS_CREDENTIALS: true
    volumes:
      - ./backend/logs:/app/backend/logs
      - ./backend/uploads:/app/backend/uploads
      # Use SQLite volume only if DB_ADAPTER=sqlite
      # - ./backend/database:/app/backend/database
    ports:
      - "3001:3001"     # Application port
      - "9090:9090"     # Metrics port
    networks:
      - lims-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: lims-nginx
    restart: unless-stopped
    depends_on:
      - lims-app
    volumes:
      - ./nginx.production.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-cache:/var/cache/nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - lims-network
    profiles:
      - with-nginx

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: lims-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9091:9090"
    networks:
      - lims-network
    profiles:
      - monitoring

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: lims-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - lims-network
    profiles:
      - monitoring

networks:
  lims-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local