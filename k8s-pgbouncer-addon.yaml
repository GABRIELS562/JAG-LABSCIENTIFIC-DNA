---
# PgBouncer Connection Pooler for Production LIMS
# This is an optional addon for improved database connection management

apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: production
  labels:
    app: pgbouncer
    component: connection-pooler
data:
  pgbouncer.ini: |
    [databases]
    limsdb = host=postgresql.production.svc.cluster.local port=5432 dbname=limsdb

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 5432
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt
    admin_users = pgbouncer
    stats_users = pgbouncer

    # Connection pooling settings
    pool_mode = transaction
    max_client_conn = 200
    default_pool_size = 20
    min_pool_size = 5
    reserve_pool_size = 5
    max_db_connections = 50
    max_user_connections = 100

    # Connection limits
    server_reset_query = DISCARD ALL
    server_check_delay = 30
    server_check_query = SELECT 1
    server_connect_timeout = 15
    server_login_retry = 15

    # Logging
    log_connections = 1
    log_disconnections = 1
    log_pooler_errors = 1
    log_stats = 1

    # Performance
    tcp_keepalives_idle = 600
    tcp_keepalives_interval = 30
    tcp_keepalives_count = 3

  userlist.txt: |
    "lims_user" "md5de58dc4b6cf45170f91bce84dc2c96c2"
    "pgbouncer" "md5e1d54b85b5d2e3b2c4e5f6a7b8c9d0e1"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: production
  labels:
    app: pgbouncer
    component: connection-pooler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
      component: connection-pooler
  template:
    metadata:
      labels:
        app: pgbouncer
        component: connection-pooler
    spec:
      containers:
      - name: pgbouncer
        image: pgbouncer/pgbouncer:1.20.1
        ports:
        - containerPort: 5432
          name: pgbouncer
        env:
        - name: DATABASES_HOST
          value: "postgresql.production.svc.cluster.local"
        - name: DATABASES_PORT
          value: "5432"
        - name: DATABASES_USER
          value: "lims_user"
        - name: DATABASES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lims-secrets
              key: POSTGRES_PASSWORD
        - name: DATABASES_DBNAME
          value: "limsdb"
        - name: POOL_MODE
          value: "transaction"
        - name: MAX_CLIENT_CONN
          value: "200"
        - name: DEFAULT_POOL_SIZE
          value: "20"
        volumeMounts:
        - name: pgbouncer-config
          mountPath: /etc/pgbouncer/pgbouncer.ini
          subPath: pgbouncer.ini
        - name: pgbouncer-config
          mountPath: /etc/pgbouncer/userlist.txt
          subPath: userlist.txt
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: pgbouncer-config
        configMap:
          name: pgbouncer-config
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999

---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: production
  labels:
    app: pgbouncer
    component: connection-pooler
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    name: pgbouncer
  selector:
    app: pgbouncer
    component: connection-pooler

---
# ServiceMonitor for PgBouncer metrics (optional)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pgbouncer-metrics
  namespace: production
  labels:
    app: pgbouncer
    component: monitoring
spec:
  selector:
    matchLabels:
      app: pgbouncer
  endpoints:
  - port: pgbouncer
    path: /metrics
    interval: 30s

---
# Instructions ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-instructions
  namespace: production
  labels:
    app: pgbouncer
    component: documentation
data:
  README.md: |
    # PgBouncer Connection Pooler for LIMS

    ## Overview
    PgBouncer is a lightweight connection pooler for PostgreSQL that can significantly
    improve database performance under high load conditions.

    ## Configuration
    - Pool Mode: Transaction (best for web applications)
    - Max Client Connections: 200
    - Default Pool Size: 20 per database
    - Connection pooling reduces overhead and improves performance

    ## Usage
    To use PgBouncer instead of direct PostgreSQL connection:

    1. Update the LIMS application configuration:
       DB_HOST: pgbouncer.production.svc.cluster.local
       DB_PORT: 5432

    2. Deploy PgBouncer:
       kubectl apply -f k8s-pgbouncer-addon.yaml

    3. Update the LIMS deployment to use PgBouncer as the database host

    ## Monitoring
    - PgBouncer exposes statistics at port 5432
    - Use SHOW STATS; SHOW POOLS; commands to monitor
    - ServiceMonitor included for Prometheus integration

    ## Benefits
    - Reduced connection overhead
    - Better resource utilization
    - Improved performance under load
    - Connection limiting and queuing

    ## Testing
    # Test PgBouncer connectivity
    kubectl exec -it deployment/pgbouncer -n production -- psql -h localhost -p 5432 -U lims_user -d limsdb

    # Check pool statistics
    kubectl exec -it deployment/pgbouncer -n production -- psql -h localhost -p 5432 -U pgbouncer -d pgbouncer -c "SHOW POOLS;"