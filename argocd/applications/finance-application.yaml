# ArgoCD Application for Finance
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finance
  namespace: argocd
  labels:
    app: finance
    team: devops
    env: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: portfolio

  source:
    repoURL: https://github.com/GABRIELS562/JAG-LABSCIENTIFIC-DNA.git
    targetRevision: main
    path: k8s/apps/finance

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
