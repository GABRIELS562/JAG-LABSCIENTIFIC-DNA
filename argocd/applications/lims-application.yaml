# ArgoCD Application for LIMS
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lims
  namespace: argocd
  labels:
    app: lims
    team: devops
    env: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: portfolio

  source:
    repoURL: https://github.com/GABRIELS562/JAG-LABSCIENTIFIC-DNA.git
    targetRevision: main
    path: helm/lims
    helm:
      valueFiles:
        - values-production.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Health checks
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
