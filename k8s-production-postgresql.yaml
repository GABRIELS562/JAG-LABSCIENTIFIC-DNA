---
# Namespace for production deployment
apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    name: production
    app.kubernetes.io/name: lims
    app.kubernetes.io/component: namespace

---
# ConfigMap for database configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: lims-config
  namespace: production
  labels:
    app: lims
    component: config
data:
  # Database configuration
  DB_HOST: "postgresql.production.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "limsdb"
  DB_USER: "lims_user"
  POSTGRES_HOST: "postgresql.production.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "limsdb"
  POSTGRES_USER: "lims_user"

  # Application configuration
  NODE_ENV: "production"
  PORT: "3001"
  HOST: "0.0.0.0"
  SERVE_STATIC: "true"
  VITE_API_URL: ""

  # Performance settings
  DATABASE_POOL_MIN: "2"
  DATABASE_POOL_MAX: "20"
  DATABASE_ENABLE_LOGGING: "false"

  # Feature flags
  ENABLE_DEVOPS_FEATURES: "true"
  ENABLE_WORKFLOW_AUTOMATION: "true"
  ENABLE_METRICS: "true"
  ENABLE_HEALTH_CHECK: "true"

  # Security settings
  TRUST_PROXY: "true"
  CORS_ORIGIN: "*"
  CORS_CREDENTIALS: "true"

---
# Secret for database credentials and sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: lims-secrets
  namespace: production
  labels:
    app: lims
    component: secrets
type: Opaque
data:
  # Base64 encoded values (use: echo -n "password" | base64)
  DB_PASSWORD: bGltczIwMjRzZWN1cmU= # lims2024secure
  POSTGRES_PASSWORD: bGltczIwMjRzZWN1cmU= # lims2024secure
  JWT_SECRET: cHJvZHVjdGlvbi1qd3Qtc2VjcmV0LWNoYW5nZS1tZQ== # production-jwt-secret-change-me
  SESSION_SECRET: cHJvZHVjdGlvbi1zZXNzaW9uLXNlY3JldC1jaGFuZ2UtbWU= # production-session-secret-change-me
  ADMIN_PASSWORD: YWRtaW4yMDI0 # admin2024

---
# PostgreSQL StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: production
  labels:
    app: postgresql
    component: database
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
        component: database
    spec:
      containers:
      - name: postgresql
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgresql
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lims-secrets
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgresql-data
          mountPath: /var/lib/postgresql/data
        - name: postgresql-config
          mountPath: /etc/postgresql/postgresql.conf
          subPath: postgresql.conf
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: postgresql-config
        configMap:
          name: postgresql-config
  volumeClaimTemplates:
  - metadata:
      name: postgresql-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi

---
# PostgreSQL Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-config
  namespace: production
  labels:
    app: postgresql
    component: config
data:
  postgresql.conf: |
    # PostgreSQL configuration for LIMS production
    listen_addresses = '*'
    max_connections = 100
    shared_buffers = 128MB
    effective_cache_size = 512MB
    maintenance_work_mem = 64MB
    checkpoint_completion_target = 0.7
    wal_buffers = 16MB
    default_statistics_target = 100
    random_page_cost = 1.1
    effective_io_concurrency = 200
    work_mem = 4MB
    min_wal_size = 1GB
    max_wal_size = 4GB
    max_worker_processes = 8
    max_parallel_workers_per_gather = 2
    max_parallel_workers = 8
    max_parallel_maintenance_workers = 2
    log_statement = 'none'
    log_min_duration_statement = 1000
    log_line_prefix = '%t [%p-%l] %q%u@%d '

---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: production
  labels:
    app: postgresql
    component: database
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgresql
  selector:
    app: postgresql

---
# LIMS Application Deployment with init container
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lims-app
  namespace: production
  labels:
    app: lims
    component: application
    version: v1.0.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: lims
      component: application
  template:
    metadata:
      labels:
        app: lims
        component: application
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      # Init container to wait for PostgreSQL
      initContainers:
      - name: wait-for-db
        image: postgres:15-alpine
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: DB_PORT
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lims-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: DB_NAME
        command:
        - sh
        - -c
        - |
          echo "⏳ Waiting for PostgreSQL to be ready..."
          until pg_isready -h $DB_HOST -p $DB_PORT -U $DB_USER; do
            echo "PostgreSQL is unavailable - sleeping"
            sleep 2
          done
          echo "✅ PostgreSQL is ready!"
          echo "🔍 Testing database connection..."
          PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -p $DB_PORT -U $DB_USER -d $DB_NAME -c "SELECT 1;" || exit 1
          echo "✅ Database connection successful!"

      containers:
      - name: lims
        image: localhost:5000/lims-full:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        env:
        # Database configuration from ConfigMap
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: DB_USER
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: POSTGRES_USER

        # Database credentials from Secret
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lims-secrets
              key: DB_PASSWORD
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lims-secrets
              key: POSTGRES_PASSWORD

        # Application configuration from ConfigMap
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: PORT
        - name: HOST
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: HOST
        - name: SERVE_STATIC
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: SERVE_STATIC
        - name: VITE_API_URL
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: VITE_API_URL

        # Performance settings
        - name: DATABASE_POOL_MIN
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: DATABASE_POOL_MIN
        - name: DATABASE_POOL_MAX
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: DATABASE_POOL_MAX
        - name: DATABASE_ENABLE_LOGGING
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: DATABASE_ENABLE_LOGGING

        # Feature flags
        - name: ENABLE_DEVOPS_FEATURES
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: ENABLE_DEVOPS_FEATURES
        - name: ENABLE_WORKFLOW_AUTOMATION
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: ENABLE_WORKFLOW_AUTOMATION
        - name: ENABLE_METRICS
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: ENABLE_METRICS
        - name: ENABLE_HEALTH_CHECK
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: ENABLE_HEALTH_CHECK

        # Security configuration
        - name: TRUST_PROXY
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: TRUST_PROXY
        - name: CORS_ORIGIN
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: CORS_ORIGIN
        - name: CORS_CREDENTIALS
          valueFrom:
            configMapKeyRef:
              name: lims-config
              key: CORS_CREDENTIALS

        # Secrets
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: lims-secrets
              key: JWT_SECRET
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: lims-secrets
              key: SESSION_SECRET
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lims-secrets
              key: ADMIN_PASSWORD

        # Kubernetes-specific environment
        - name: KUBERNETES_SERVICE_HOST
          value: "kubernetes.default.svc.cluster.local"

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

        # Health and readiness probes
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3001
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1

        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1

        # Startup probe for slow startup
        startupProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
          successThreshold: 1

        # Volume mounts
        volumeMounts:
        - name: lims-logs
          mountPath: /app/backend/logs
        - name: lims-temp
          mountPath: /app/temp
        - name: lims-config-volume
          mountPath: /app/.env
          subPath: .env
          readOnly: true

      # Volumes
      volumes:
      - name: lims-logs
        emptyDir:
          sizeLimit: 1Gi
      - name: lims-temp
        emptyDir:
          sizeLimit: 2Gi
      - name: lims-config-volume
        configMap:
          name: lims-runtime-config

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      # Pod scheduling
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: lims
                  component: application
              topologyKey: kubernetes.io/hostname

      # Restart policy
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
# Runtime configuration for the application
apiVersion: v1
kind: ConfigMap
metadata:
  name: lims-runtime-config
  namespace: production
  labels:
    app: lims
    component: runtime-config
data:
  .env: |
    # JAG DNA Scientific LIMS - Production Configuration
    NODE_ENV=production
    PORT=3001
    HOST=0.0.0.0
    SERVE_STATIC=true
    VITE_API_URL=
    TRUST_PROXY=true
    ENABLE_DEVOPS_FEATURES=true
    ENABLE_WORKFLOW_AUTOMATION=true
    ENABLE_METRICS=true
    ENABLE_HEALTH_CHECK=true
    DATABASE_POOL_MIN=2
    DATABASE_POOL_MAX=20
    DATABASE_ENABLE_LOGGING=false
    CORS_ORIGIN=*
    CORS_CREDENTIALS=true

---
# LIMS Application Service
apiVersion: v1
kind: Service
metadata:
  name: lims-service
  namespace: production
  labels:
    app: lims
    component: application
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3001"
    prometheus.io/path: "/metrics"
spec:
  type: NodePort
  selector:
    app: lims
    component: application
  ports:
  - name: http
    port: 3001
    targetPort: 3001
    nodePort: 30001
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 3001
    protocol: TCP

---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lims-ingress
  namespace: production
  labels:
    app: lims
    component: ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key"
    nginx.ingress.kubernetes.io/cors-expose-headers: "X-Total-Count,X-Request-ID"
    nginx.ingress.kubernetes.io/cors-max-age: "86400"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/client-max-body-size: "10m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - lims.jagdevops.co.za
    secretName: lims-tls
  rules:
  - host: lims.jagdevops.co.za
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lims-service
            port:
              number: 3001

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lims-hpa
  namespace: production
  labels:
    app: lims
    component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lims-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max

---
# Network Policy for database access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lims-network-policy
  namespace: production
  labels:
    app: lims
    component: network-policy
spec:
  podSelector:
    matchLabels:
      app: postgresql
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: lims
          component: application
    ports:
    - protocol: TCP
      port: 5432

---
# Service Monitor for Prometheus (if using Prometheus Operator)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lims-metrics
  namespace: production
  labels:
    app: lims
    component: monitoring
spec:
  selector:
    matchLabels:
      app: lims
      component: application
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
  - port: http
    path: /api/devops-metrics
    interval: 60s
    scrapeTimeout: 15s
    honorLabels: true

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lims-pdb
  namespace: production
  labels:
    app: lims
    component: disruption-budget
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: lims
      component: application