apiVersion: apps/v1
kind: Deployment
metadata:
  name: lims-full-app
  namespace: production
  labels:
    app: lims-full
    version: v1.0.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lims-full
  template:
    metadata:
      labels:
        app: lims-full
    spec:
      containers:
      - name: lims
        image: localhost:5000/lims-full:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5173
          name: frontend
          protocol: TCP
        - containerPort: 3001
          name: backend
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: VITE_API_URL
          value: "http://localhost:3001"
        - name: BACKEND_PORT
          value: "3001"
        - name: FRONTEND_PORT
          value: "5173"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: lims-logs
          mountPath: /app/backend/logs
        - name: lims-temp
          mountPath: /app/temp
      volumes:
      - name: lims-logs
        emptyDir: {}
      - name: lims-temp
        emptyDir: {}
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: lims-full-service
  namespace: production
  labels:
    app: lims-full
spec:
  type: NodePort
  selector:
    app: lims-full
  ports:
  - name: frontend
    port: 5173
    targetPort: 5173
    nodePort: 30001
    protocol: TCP
  - name: backend
    port: 3001
    targetPort: 3001
    nodePort: 30002
    protocol: TCP

---
# Optional: Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lims-full-ingress
  namespace: production
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
spec:
  rules:
  - host: lims.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lims-full-service
            port:
              number: 5173
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: lims-full-service
            port:
              number: 3001

---
# Namespace creation (if needed)
apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    name: production