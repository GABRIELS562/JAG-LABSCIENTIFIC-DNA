apiVersion: v1
kind: Service
metadata:
  name: lims-complete-service
  namespace: production
spec:
  selector:
    app: lims-complete
  ports:
    - protocol: TCP
      port: 3001        # Changed from 5173 to 3001
      targetPort: 3001  # Backend serves everything on 3001
      nodePort: 30007   # External access port
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lims-complete
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lims-complete
  template:
    metadata:
      labels:
        app: lims-complete
    spec:
      containers:
      - name: lims-complete
        image: gabriels562/lims-complete:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001  # Changed from 5173 to 3001
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: SERVE_STATIC
          value: "true"
        - name: VITE_API_URL
          value: ""  # Empty for relative paths
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "lims_user"
        - name: DB_PASSWORD
          value: "lims2024secure"
        - name: DB_NAME
          value: "limsdb"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/test
            port: 3001
          initialDelaySeconds: 120  # Give time for build
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/test
            port: 3001
          initialDelaySeconds: 90
          periodSeconds: 5
          failureThreshold: 3